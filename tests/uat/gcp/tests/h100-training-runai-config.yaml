# AICRConfig consumed by `aicr {snapshot,recipe,bundle,validate} --config`.
#
# Run:ai variant of h100-training-config.yaml (NVIDIA/aicr#3302, Phase 1):
# the same GKE H100 training cluster, recipe `platform: runai`, which adds
# the Run:ai cluster side (runai-cluster) and drops AICR's kai-scheduler.
# Selected by `platform=runai` on a gcp reservation, which maps to this
# filename (h100-<intent>-<platform>-config.yaml).
#
# Three things differ from the kubeflow sibling, all forced by the
# runai-cluster component:
#   - `deployer: helm`: the bundler admits only the helm deployer for a
#     component with an install-time secret (the registration token), whose
#     install.sh reads it from cluster-values.yaml and refuses an empty stub.
#   - `deployment.dynamic` declares that token path. The lane's install phase
#     mints the token from the control plane right before deploy.sh and
#     clears the stub right after (tests/uat/lib/runai-harness.sh); it never
#     reaches this file, the bundle's values.yaml or the evidence.
#   - `deployment.set` stays EMPTY: the three registration values
#     (controlPlane.url, cluster.uid, cluster.url) are per run and ride in as
#     `--set` from phase_prep, and a CLI --set replaces this list.
# The control plane is a CI fixture, not something AICR installs; see "The
# Run:ai lane" in docs/contributor/uat.md for the credential and the harness.
#
# `spec.validate.evidence.attestation.push` carries the stable per-recipe
# repo only; `../run` appends a `:run-${RUN_ID}` tag at runtime so each UAT
# execution publishes a uniquely traceable, digest-addressed point under one
# stable repo (`oras repo tags` lists run history). Consumers pin immutably
# via `@sha256:…`.
kind: AICRConfig
apiVersion: aicr.run/v1beta1
metadata:
  name: gke-h100-training-runai-uat

spec:
  snapshot:
    output:
      path: snapshot.yaml
    agent:
      namespace: aicr-validation
      nodeSelector:
        nodeGroup: gpu-worker
      tolerations:
        - dedicated=gpu-workload:NoSchedule
        - nvidia.com/gpu=present:NoSchedule

  recipe:
    criteria:
      service: gke
      accelerator: h100
      os: cos
      intent: training
      platform: runai
    # No `configuration.gke.tcpxoInterfaces` here, unlike the kubeflow
    # sibling: `aicr recipe` accepts that mapping only when the platform is
    # kubeflow (the TCPXO TrainingRuntime is what consumes it), and refuses the
    # config otherwise. The gke-nccl-tcpxo DaemonSets the leaf inherits from
    # h100-gke-cos-training still deploy; tests/uat/gcp/run derives the
    # per-run mapping for the kubeflow config only.
    output:
      path: recipe.yaml

  bundle:
    input:
      recipe: recipe.yaml
    output:
      target: ./bundle
    deployment:
      deployer: helm
      # No NVSentinel override: the gke-default gpuStack profile assigns
      # labeler.assumeDriverInstalled itself (#2181), so this lane
      # exercises the recipe supplying the remedy unaided.
      # Install-time secret stub (see the header): filled by the lane right
      # before deploy.sh, cleared right after. `set` is deliberately absent.
      dynamic:
        - runai:controlPlane.bootstrapToken
    scheduling:
      acceleratedNodeSelector:
        nodeGroup: gpu-worker
      acceleratedNodeTolerations:
        - dedicated=gpu-workload:NoSchedule
        - nvidia.com/gpu=present:NoSchedule
      systemNodeSelector:
        nodeGroup: system-worker
      # GKE pd-ssd-backed default; matches the UAT GPU node disk type.
      storageClass: premium-rwo

  validate:
    execution:
      # The deployment phase is the readiness barrier (gpu-operator ClusterPolicy
      # reaches state=ready, the DRA kubelet-plugin DaemonSet rolls out, nodewright
      # node tuning completes). failFast stops the run if that phase fails, so the
      # conformance/performance phases are not evaluated against a not-yet-converged
      # cluster — which previously surfaced as misleading accelerator-metrics /
      # ai-service-metrics / pod-autoscaling failures. The `../run` readiness gate
      # gives the operator-driven stack time to converge before validate, so on a
      # healthy cluster the deployment phase passes and all phases still run.
      failFast: true
    input:
      recipe: recipe.yaml
      snapshot: snapshot.yaml
    agent:
      namespace: aicr-validation
      tolerations:
        - dedicated=gpu-workload:NoSchedule
        - nvidia.com/gpu=present:NoSchedule
    evidence:
      attestation:
        # Setting `out` enables emit. The push target below is the stable
        # per-recipe repo; ../run appends a `:run-${RUN_ID}` tag for per-run
        # isolation. Consumers pin immutably via the artifact digest.
        out: ./evidence
        push: ghcr.io/nvidia/aicr-evidence/h100-gke-cos-training-runai
